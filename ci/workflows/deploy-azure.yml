name: deploy-azure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Harbor infrastructure
        run: >
          az deployment group create
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --template-file infra/main.bicep
          --parameters namePrefix=${{ vars.HARBOR_NAME_PREFIX }}
          alertEmail=${{ vars.HARBOR_ALERT_EMAIL }}
          tenantId=${{ vars.AZURE_TENANT_ID }}
          deployFoundry=${{ vars.HARBOR_DEPLOY_FOUNDRY }}
          deploySearch=${{ vars.HARBOR_DEPLOY_SEARCH }}
          deployApim=${{ vars.HARBOR_DEPLOY_APIM }}
          deploySql=${{ vars.HARBOR_DEPLOY_SQL }}
